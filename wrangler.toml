name = "aippy-bot"
main = "worker.js"
compatibility_date = "2024-11-01"

# Workers AI binding (chat brain)
[ai]
binding = "AI"

# /link sign-in code storage (used by the Free Video Generator site)
[durable_objects]
bindings = [{ name = "LINK_DO", class_name = "LinkStore" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LinkStore"]

# Dashboard alternative: paste worker.js into the online editor and add:
#  - Binding: Workers AI, variable name "AI"
#  - Variables: DISCORD_APP_ID, DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN
